{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-shadow: none;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0a1;
        }
        .heading {
            color: #1aca1a;
            text-align: center;
            margin-bottom: 20px;
            background-color: rgba(0, 0, 0, 0.76);
            padding: 20px;
        }
        .container {
            background-color: #1aca1a;
            margin-top: -15px;
            padding: 10px;
        }
        .container nav ul {
            list-style-type: none;
            display: flex;
            justify-content: space-between;
            margin-left: 15px;
        }
        .container nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .container nav ul li a:hover {
            text-decoration: underline;
        }
        .foot {
            text-align: center;
            padding: 20px;
            background-color: #1aca1a;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
        .container nav ul {
            flex-direction: column;
            align-items: center;
        }
        .container nav ul li {
            margin-bottom: 10px;
        }
        .container nav ul li a:hover{
            text-decoration: underline;
        }
        .container nav ul li a{
            display:block;
        }
    }
    </style>

    <h1 class="heading">My Portfolio</h1>    

    <div class="container">
        <nav>
            <ul>
                <li><a href="{% url 'about' %}">About</a></li>
                <li><a href="{% url 'qualifications' %}">Qualifications</a></li>
                <li><a href="{% url 'skills' %}">Skills</a></li>
                <li><a href="{% url 'certificates' %}">Certificates</a></li>
                <li><a href="{% url 'projects' %}">Projects</a></li>
            </ul>
        </nav>
    </div>
    
    <!-- ✅ ONLY THIS PART SHOULD BE BLOCK -->
    {% block content %}
    {% endblock %}
<footer class="foot">

    <a href="https://github.com/Sharath-ah-tech" target="_blank">GitHub Profile</a>
</footer>
</body>
</html>
